<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>송금 요청</title>
    <script type="text/javascript" src="qrcode.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9fafb;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333d4b;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #qrcode {
            margin: 30px auto;
            width: 200px;
            height: 200px;
        }
        #qrcode img {
            max-width: 100%;
            height: auto;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .button {
            border: none;
            border-radius: 10px;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.3s ease;
            text-decoration: none;
            display: block;
        }
        .button:hover {
            opacity: 0.9;
        }
        .button-toss {
            background-color: #3182f6;
            color: white;
        }
        .button-kakao {
            background-color: #FFEB00;
            color: #3C1E1E;
        }
        p {
            color: #6b7684;
            font-size: 14px;
            margin-top: 20px;
            line-height: 1.5;
        }
        .account-info {
            background-color: #f2f4f6;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 16px;
            color: #333d4b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- The heading is updated dynamically. By default, it shows a generic message. -->
        <!-- If an amount is passed in the URL, it shows the requested amount. -->
        <!-- TODO: DEVELOPER - Change "???" to the recipient's name. -->
        <h1>???에게 송금하기</h1>

        <!-- This div is where the QR code will be generated. -->
        <div id="qrcode"></div>

        <!-- These buttons trigger the app deep links. -->
        <div class="button-group">
            <button class="button button-toss" onclick="triggerTossSend()">토스로 송금하기</button>
            <button class="button button-kakao" onclick="triggerKakaoSend()">카카오페이로 송금하기</button>
        </div>

        <!-- This section displays the bank and account information. -->
        <!-- TODO: DEVELOPER - Update your bank name and account number here. -->
        <div class="account-info">
            <strong>은행</strong> 계좌번호
        </div>

        <p>송금하기는 각 앱이 설치되어 있어야 가능합니다.<br>앱이 설치되어 있지 않다면 설치 후 진행해주세요.</p>
    </div>

    <script type="text/javascript">
        // --- Configuration ---
        // TODO: DEVELOPER - Set your bank name, account number, and bank code.
        // These values are used to generate the Toss and Kakao Pay deep links.
        const BANK_NAME = "은행"; // Example: "토스뱅크"
        const ACCOUNT_NUMBER = "계좌번호"; // Example: "100012345678"
        const BANK_CODE = "000"; // Example: "092" for Toss Bank. See below for common codes.

        /*
        Common Bank Codes:
        - 산업은행: 002, 기업은행: 003, 국민은행: 004, 수협은행: 007, 농협은행: 011, 우리은행: 020,
        - SC제일은행: 023, 씨티은행: 027, 대구은행: 031, 부산은행: 032, 광주은행: 034, 제주은행: 035,
        - 전북은행: 037, 경남은행: 039, 하나은행: 081, 신한은행: 088, 케이뱅크: 089, 카카오뱅크: 090,
        - 토스뱅크: 092, 새마을금고: 045, 신협: 048, 우체국: 071
        */

        // --- Main Logic ---

        // Get the payment amount from the URL query string.
        const amount = (window.location.search.substring(1) || '0').split('/')[0];

        // Construct the Toss deep link URL.
        const tossDeeplink = `supertoss://send?amount=${amount}&bank=${BANK_NAME}&accountNo=${ACCOUNT_NUMBER}`;

        // Construct the Kakao Pay deep link URL.
        const kakaoDeeplink = `kakaotalk://kakaopay/money/to/bank?bank_code=${BANK_CODE}&bank_account_number=${ACCOUNT_NUMBER}&amount=${amount}`;

        // If an amount is specified in the URL, update the main heading to show the requested amount.
        if (amount !== '0') {
            const formattedAmount = parseInt(amount, 10).toLocaleString();
            document.querySelector('h1').textContent = `${formattedAmount}원 보내주세요`;
        }

        // Update the account information on the page with the configured values.
        document.querySelector('.account-info').innerHTML = `<strong>${BANK_NAME}</strong> ${ACCOUNT_NUMBER}`;

        // Generate the QR code using the qrcode.js library.
        // The QR code contains the current page URL, so scanning it leads back here.
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 200,
            height: 200,
            colorDark : "#333d4b",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        /**
         * This function is called when the "토스로 송금하기" button is clicked.
         * It triggers the Toss deep link, which opens the Toss app.
         */
        function triggerTossSend() {
            window.location.href = tossDeeplink;
        }

        /**
         * This function is called when the "카카오페이로 송금하기" button is clicked.
         * It triggers the Kakao Pay deep link, which opens the KakaoTalk app.
         */
        function triggerKakaoSend() {
            window.location.href = kakaoDeeplink;
        }
    </script>
</body>
</html>
