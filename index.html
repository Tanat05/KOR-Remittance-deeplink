<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>송금 요청</title>
    <script type="text/javascript" src="qrcode.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9fafb;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333d4b;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #qrcode {
            margin: 30px auto;
            width: 200px;
            height: 200px;
        }
        #qrcode img {
            max-width: 100%;
            height: auto;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .button {
            border: none;
            border-radius: 10px;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.3s ease;
            text-decoration: none;
            display: block;
        }
        .button:hover {
            opacity: 0.9;
        }
        .button-toss {
            background-color: #3182f6;
            color: white;
        }
        .button-kakao {
            background-color: #FFEB00;
            color: #3C1E1E;
        }
        p {
            color: #6b7684;
            font-size: 14px;
            margin-top: 20px;
            line-height: 1.5;
        }
        .account-info {
            background-color: #f2f4f6;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 16px;
            color: #333d4b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 제목은 동적으로 업데이트됩니다. 기본적으로 일반적인 메시지를 표시합니다. -->
        <!-- URL에 금액이 포함된 경우 요청된 금액을 표시합니다. -->
        <!-- TODO: 개발자 - "???"를 수취인의 이름으로 변경하세요. -->
        <h1>???에게 송금하기</h1>

        <!-- 이 div에 QR 코드가 생성됩니다. -->
        <div id="qrcode"></div>

        <!-- 이 버튼들은 앱 딥링크를 실행합니다. -->
        <div class="button-group">
            <button class="button button-toss" onclick="triggerTossSend()">토스로 송금하기</button>
            <button class="button button-kakao" onclick="triggerKakaoSend()">카카오페이로 송금하기</button>
        </div>

        <!-- 이 섹션에는 은행 및 계좌 정보가 표시됩니다. -->
        <!-- TODO: 개발자 - 본인의 은행 이름과 계좌 번호로 업데이트하세요. -->
        <div class="account-info">
            <strong>은행</strong> 계좌번호
        </div>

        <p>송금하기는 각 앱이 설치되어 있어야 가능합니다.<br>앱이 설치되어 있지 않다면 설치 후 진행해주세요.</p>
    </div>

    <script type="text/javascript">
        // --- 설정 ---
        // TODO: 개발자 - 아래에 은행 이름, 계좌 번호, 은행 코드를 설정하세요.
        // 이 값들은 토스 및 카카오페이 딥링크를 생성하는 데 사용됩니다.
        const BANK_NAME = "은행"; // 예: "토스뱅크"
        const ACCOUNT_NUMBER = "계좌번호"; // 예: "100012345678"
        const BANK_CODE = "000"; // 예: 토스뱅크의 경우 "092". 아래 공통 코드 목록을 참조하세요.

        /*
        주요 은행 코드:
        - 산업은행: 002, 기업은행: 003, 국민은행: 004, 수협은행: 007, 농협은행: 011, 우리은행: 020,
        - SC제일은행: 023, 씨티은행: 027, 대구은행: 031, 부산은행: 032, 광주은행: 034, 제주은행: 035,
        - 전북은행: 037, 경남은행: 039, 하나은행: 081, 신한은행: 088, 케이뱅크: 089, 카카오뱅크: 090,
        - 토스뱅크: 092, 새마을금고: 045, 신협: 048, 우체국: 071
        */

        // --- 주요 로직 ---

        // URL 쿼리 스트링에서 송금 금액을 가져옵니다.
        const amount = (window.location.search.substring(1) || '0').split('/')[0];

        // 토스 딥링크 URL을 구성합니다.
        const tossDeeplink = `supertoss://send?amount=${amount}&bank=${BANK_NAME}&accountNo=${ACCOUNT_NUMBER}`;

        // 카카오페이 딥링크 URL을 구성합니다.
        const kakaoDeeplink = `kakaotalk://kakaopay/money/to/bank?bank_code=${BANK_CODE}&bank_account_number=${ACCOUNT_NUMBER}&amount=${amount}`;

        // URL에 금액이 지정된 경우, 메인 제목을 요청 금액으로 업데이트합니다.
        if (amount !== '0') {
            const formattedAmount = parseInt(amount, 10).toLocaleString();
            document.querySelector('h1').textContent = `${formattedAmount}원 보내주세요`;
        }

        // 페이지의 계좌 정보를 설정된 값으로 업데이트합니다.
        document.querySelector('.account-info').innerHTML = `<strong>${BANK_NAME}</strong> ${ACCOUNT_NUMBER}`;

        // qrcode.js 라이브러리를 사용하여 QR 코드를 생성합니다.
        // QR 코드에는 현재 페이지 URL이 포함되어 있어, 스캔 시 이 페이지로 다시 연결됩니다.
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 200,
            height: 200,
            colorDark : "#333d4b",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        /**
         * "토스로 송금하기" 버튼을 클릭했을 때 호출됩니다.
         * 토스 앱을 여는 딥링크를 실행합니다.
         */
        function triggerTossSend() {
            window.location.href = tossDeeplink;
        }

        /**
         * "카카오페이로 송금하기" 버튼을 클릭했을 때 호출됩니다.
         * 카카오톡 앱을 여는 카카오페이 딥링크를 실행합니다.
         */
        function triggerKakaoSend() {
            window.location.href = kakaoDeeplink;
        }
    </script>
</body>
</html>
