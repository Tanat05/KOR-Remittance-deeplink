<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toss 송금 요청</title>
    <script type="text/javascript" src="qrcode.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f9fafb;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333d4b;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #qrcode {
            margin: 30px auto;
            width: 200px;
            height: 200px;
        }
        #qrcode img {
            max-width: 100%;
            height: auto;
        }
        .button {
            background-color: #3182f6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #1c6fef;
        }
        p {
            color: #6b7684;
            font-size: 14px;
            margin-top: 20px;
            line-height: 1.5;
        }
        .account-info {
            background-color: #f2f4f6;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 16px;
            color: #333d4b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- The heading is updated dynamically. By default, it shows a generic message. -->
        <!-- If an amount is passed in the URL, it shows the requested amount. -->
        <!-- TODO: DEVELOPER - Change "???" to the recipient's name. -->
        <h1>???에게 송금하기</h1>

        <!-- This div is where the QR code will be generated. -->
        <div id="qrcode"></div>

        <!-- This button triggers the Toss app deep link. -->
        <button class="button" onclick="triggerTossSend()">토스로 송금하기</button>

        <!-- This section displays the bank and account information. -->
        <!-- TODO: DEVELOPER - Update your bank name and account number here. -->
        <div class="account-info">
            <strong>은행</strong> 계좌번호
        </div>

        <p>토스로 송금하기는 토스 앱에서만 가능합니다.<br>앱이 설치되어 있지 않다면 설치 후 진행해주세요.</p>
    </div>

    <script type="text/javascript">
        // --- Configuration ---
        // TODO: DEVELOPER - In the two lines below, set your bank and account number.
        // These values are used to generate the Toss deep link.
        const BANK_NAME = "은행"; // Example: "토스뱅크"
        const ACCOUNT_NUMBER = "계좌번호"; // Example: "100012345678"

        // --- Main Logic ---

        // Get the payment amount from the URL query string.
        // For example, for the URL "https://example.com?10000", the amount is "10000".
        // If no amount is specified, it defaults to '0'.
        const amount = (window.location.search.substring(1) || '0').split('/')[0];

        // Construct the Toss deep link URL.
        const tossDeeplink = `supertoss://send?amount=${amount}&bank=${BANK_NAME}&accountNo=${ACCOUNT_NUMBER}`;

        /**
         * On page load, this script attempts to automatically open the Toss app if an amount is specified.
         * This provides a seamless experience for users opening the link on a mobile device.
         */
        window.onload = function() {
            // Only redirect if an amount is present in the URL.
            if (amount !== '0') {
                window.location.href = tossDeeplink;
            }
        };

        // If an amount is specified in the URL, update the main heading to show the requested amount.
        if (amount !== '0') {
            const formattedAmount = parseInt(amount, 10).toLocaleString();
            document.querySelector('h1').textContent = `${formattedAmount}원 보내주세요`;
        }

        // Update the account information on the page with the configured values.
        document.querySelector('.account-info').innerHTML = `<strong>${BANK_NAME}</strong> ${ACCOUNT_NUMBER}`;

        // Generate the QR code using the qrcode.js library.
        // The QR code contains the Toss deep link, allowing users to scan it to open the payment screen on their phone.
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            text: tossDeeplink,
            width: 200,
            height: 200,
            colorDark : "#333d4b",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        /**
         * This function is called when the "토스로 송금하기" button is clicked.
         * It triggers the Toss deep link, which opens the Toss app.
         */
        function triggerTossSend() {
            window.location.href = tossDeeplink;
        }
    </script>
</body>
</html>
